# Strimzi and the Flink Kubernetes operator, both into the `operators` namespace.
#
# Separate from p01-streaming rather than folded into its overlay, because kustomize's `namespace:`
# transformer would rewrite these into `p01-streaming` and quietly undo the point: project 5 runs
# Beam on the same Flink runner and will declare its own KafkaTopic resources, so both operators are
# shared infrastructure that p01 merely installs first.
#
# Sync wave 1 puts these ahead of p01-streaming (wave 5). The CRDs must exist before anything
# submits a Kafka or FlinkDeployment resource, or the first sync fails on an unknown kind.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p01-operators
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: portfolio

  source:
    repoURL: https://github.com/varun-prakasam/p01-streaming.git
    targetRevision: main
    path: k8s/operators

  destination:
    server: https://kubernetes.default.svc
    namespace: operators

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Operator CRDs exceed the 262144-byte annotation that client-side apply writes.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

  ignoreDifferences:
    # The API server adds `spec.conversion: {strategy: None}` to every CRD that omits it, and
    # neither operator's chart writes one. Without this the five largest CRDs sit permanently
    # OutOfSync over a field the cluster set itself, and a real drift would be invisible among them.
    #
    # Safe to ignore wholesale rather than just the caBundle: nothing here uses a conversion
    # webhook, both operators serve a single storage version, and cert-manager is not installed.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
