# Strimzi and the Flink Kubernetes operator, both into the `operators` namespace.
#
# Separate from p01-streaming rather than folded into its overlay, because kustomize's `namespace:`
# transformer would rewrite these into `p01-streaming` and quietly undo the point: project 5 runs
# Beam on the same Flink runner and will declare its own KafkaTopic resources, so both operators are
# shared infrastructure that p01 merely installs first.
#
# Sync wave 1 puts these ahead of p01-streaming (wave 5). The CRDs must exist before anything
# submits a Kafka or FlinkDeployment resource, or the first sync fails on an unknown kind.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p01-operators
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Ask the API server to dry-run the apply and diff the result, rather than comparing the
    # manifest against what the cluster stored. Operator CRDs are normalised on write — the schema
    # loses `properties` wherever x-kubernetes-preserve-unknown-fields is set, `spec.conversion` and
    # `names.listKind` are defaulted in, and `priority: 0` is pruned from printer columns. Comparing
    # the two directly leaves five CRDs permanently OutOfSync over changes the cluster made itself,
    # which selfHeal then tries to undo on a loop while real drift hides in the noise.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: portfolio

  source:
    repoURL: https://github.com/varun-prakasam/p01-streaming.git
    targetRevision: main
    path: k8s/operators

  destination:
    server: https://kubernetes.default.svc
    namespace: operators

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Operator CRDs exceed the 262144-byte annotation that client-side apply writes.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
