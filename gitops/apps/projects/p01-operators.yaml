# Strimzi and the Flink Kubernetes operator, both into the `operators` namespace.
#
# Separate from p01-streaming rather than folded into its overlay, because kustomize's `namespace:`
# transformer would rewrite these into `p01-streaming` and quietly undo the point: project 5 runs
# Beam on the same Flink runner and will declare its own KafkaTopic resources, so both operators are
# shared infrastructure that p01 merely installs first.
#
# Sync wave 1 puts these ahead of p01-streaming (wave 5). The CRDs must exist before anything
# submits a Kafka or FlinkDeployment resource, or the first sync fails on an unknown kind.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p01-operators
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: portfolio

  source:
    repoURL: https://github.com/varun-prakasam/p01-streaming.git
    targetRevision: main
    path: k8s/operators

  destination:
    server: https://kubernetes.default.svc
    namespace: operators

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Operator CRDs exceed the 262144-byte annotation that client-side apply writes.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

  ignoreDifferences:
    # cert-manager is not installed, so the Flink operator's webhook is disabled at install time.
    # Kubernetes still defaults caBundle on any CRD conversion stanza that survives, and ArgoCD
    # would report that server-set field as a permanent diff.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
