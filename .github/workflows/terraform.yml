name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  # Required for Workload Identity Federation. Without it the OIDC token is never minted.
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  WORKING_DIR: terraform
  TF_IN_AUTOMATION: "true"

# Input variables are defined per job rather than at workflow level, and only on the jobs that
# actually evaluate expressions — plan and apply. Setting them globally exported
# TF_VAR_authorized_networks as an empty string to tflint, and an empty string is not a valid value
# for a list type: it fails to parse where an unset variable would simply have no value. tflint and
# validate never need inputs, so giving them any is all cost.
#
# Plan and apply share one anchor so they cannot drift. A plan reviewed against different values
# than the apply uses is worse than no plan at all.

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The platform authenticates with Workload Identity everywhere, so a service account key in
      # this repository is always a mistake. Catching it at CI is the backstop for .gitignore, which
      # only helps if the filename happens to match.
      - name: Reject committed service account keys
        run: |
          set -euo pipefail

          # Both markers, in the same file. A real key carries the private key alongside the type
          # field; prose that quotes one marker to explain this check carries neither. Matching on
          # the type field alone failed the build on docs/security.md — the document describing the
          # rule tripped the rule, which is the kind of false positive that gets a check deleted
          # rather than fixed.
          hits=""
          for f in $(git grep -lIE '"type"[[:space:]]*:[[:space:]]*"service_account"' -- . 2>/dev/null || true); do
            if grep -qI 'private_key' "$f"; then
              hits="$hits $f"
            fi
          done
          if [ -n "$hits" ]; then
            echo "::error::Service account key material committed:"
            for f in $hits; do echo "  $f"; done
            exit 1
          fi

          if git grep -lI -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . > /tmp/hits 2>/dev/null; then
            echo "::error::Private key committed:"
            cat /tmp/hits
            exit 1
          fi

          if git ls-files | grep -Ei '(^|/)(service-account.*\.json|.*-key\.json|.*\.json\.key|credentials\.json)$'; then
            echo "::error::Key-shaped filename committed."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(terraform\.tfvars|.*\.auto\.tfvars|\.env)$'; then
            echo "::error::Local configuration committed. These may carry account identifiers."
            exit 1
          fi

          echo "No key material found."

  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend: validation needs the provider schemas but not the remote state, and this keeps
      # the job runnable on forks and without credentials.
      - name: Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate -no-color

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - run: tflint --init
        working-directory: ${{ env.WORKING_DIR }}

      - run: tflint --recursive --format compact
        working-directory: ${{ env.WORKING_DIR }}

  security:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          quiet: true
          output_format: cli
          soft_fail: false
          # Documented, deliberate deviations. Each is a decision, not an unreviewed finding:
          #   CKV_GCP_66  binary authorization — no image signing pipeline on a solo portfolio
          #   CKV_GCP_24  private endpoint — kubectl access is needed from a laptop
          #   CKV_GCP_69  private cluster master — same
          #   CKV_GCP_61  VPC flow logs sampling — enabled at 0.1 to control logging cost
          #
          # Customer-managed encryption. Google-managed keys already encrypt everything at rest;
          # CSEK/CMEK moves key custody to a KMS keyring that then has to be funded, rotated and
          # never lost. For public city data that is cost and operational risk for no threat model:
          #   CKV_GCP_81  BigQuery datasets      CKV_GCP_83  Pub/Sub topics
          #   CKV_GCP_84  Artifact Registry
          #
          # Service account authority. Terraform creates and acts as service accounts, so the
          # deployer necessarily holds serviceAccountUser and serviceAccountAdmin, and CI holds
          # viewer to plan. Removing them does not harden the platform, it stops it working:
          #   CKV_GCP_49  impersonation roles    CKV_GCP_41  token creator / SA user
          #   CKV_GCP_117 basic roles
          #
          # Verified individually rather than waved through:
          #   CKV_GCP_62   bucket access logging — writes an access log to a second bucket that
          #                nothing reads, at ongoing storage cost.
          #   CKV_GCP_78   bucket versioning — the finding is the starrocks scratch bucket, where
          #                versioning is off by design. The Terraform state bucket is separate and
          #                has versioning enabled, which is the case that actually matters.
          #   CKV_GCP_12   network policy — the cluster runs ADVANCED_DATAPATH (Dataplane V2),
          #                which enforces network policy natively. The check looks for the legacy
          #                network_policy block, which Dataplane V2 clusters must not set.
          #   CKV_GCP_65   Google Groups for RBAC — needs a Cloud Identity group to bind, and there
          #                is one human on this platform.
          #   CKV_GCP_125  OIDC trust policy — the check wants the repository pinned in
          #                attribute_condition. It is pinned one layer lower and more strictly: the
          #                pool condition restricts to this owner, each service account binding
          #                names an exact repository, and the apply account additionally requires
          #                @refs/heads/main. A pull request cannot reach the apply identity.
          skip_check: >-
            CKV_GCP_66,CKV_GCP_24,CKV_GCP_69,CKV_GCP_61,
            CKV_GCP_81,CKV_GCP_83,CKV_GCP_84,
            CKV_GCP_49,CKV_GCP_41,CKV_GCP_117,
            CKV_GCP_62,CKV_GCP_78,CKV_GCP_12,CKV_GCP_65,CKV_GCP_125

  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [secrets, validate, lint]
    env:
      # Only the secrets. Everything else comes from terraform/prod.tfvars, which is committed, so
      # this workflow and a laptop evaluate the same configuration rather than two that happen to
      # agree. Secrets rather than variables because workflow logs on a public repository print
      # variable values in the environment dump and mask secrets.
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_authorized_networks: ${{ secrets.TF_AUTHORIZED_NETWORKS }}
      TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
    # Superseded plans on the same PR are noise. Safe to cancel: a plan changes nothing.
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      # Forks cannot mint a token against this pool, and should not be able to plan against real
      # infrastructure. Failing loudly beats a confusing auth error thirty seconds later.
      - name: Reject fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Plans do not run on forks. Push a branch to this repository instead."
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      # -lock=false because a plan makes no writes, and a cancelled plan job holding a state lock
      # would block the apply that follows the merge.
      - name: Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true
        run: terraform plan -no-color -input=false -lock=false -var-file=prod.tfvars 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');

            // GitHub rejects comments over 65536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated, see the job log for the full plan';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, validate, lint, security]
    env:
      # Only the secrets. Everything else comes from terraform/prod.tfvars, which is committed, so
      # this workflow and a laptop evaluate the same configuration rather than two that happen to
      # agree. Secrets rather than variables because workflow logs on a public repository print
      # variable values in the environment dump and mask secrets.
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_authorized_networks: ${{ secrets.TF_AUTHORIZED_NETWORKS }}
      TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
    # Requires a GitHub Environment named `production`. Add a required reviewer there if you want a
    # human gate; the branch restriction below is enforced regardless.
    environment: production
    # Never cancel a running apply — a killed apply leaves a held state lock and a half-built
    # dependency graph. Queue instead.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Impersonates the apply account, which is bound to this repository at refs/heads/main via a
      # composite repository@ref attribute in the Workload Identity pool. A pull request that edits
      # this workflow to run apply still cannot obtain these credentials — its ref is
      # refs/pull/<n>/merge, so the token exchange is refused by IAM.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_APPLY_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      # Plan to a file, then apply that file. `terraform apply -auto-approve` would re-plan against
      # whatever the state looks like at that moment; applying a saved plan means what is logged in
      # the job output is exactly what was executed.
      - name: Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -input=false -lock-timeout=5m -var-file=prod.tfvars -out=tfplan

      - name: Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -no-color -input=false -lock-timeout=5m tfplan

      - name: Summarise
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          {
            echo "### Terraform apply"
            echo
            echo '```'
            terraform output -no-color 2>&1 | head -80 || echo "outputs unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
